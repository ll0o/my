;3、节点组（api.asailor / Mihomo Provider 优化版）
;目标：原始节点交给 Mihomo 本地解析；家宽/住宅/原生优先；健康时不因延迟波动换节点；故障才 fallback。
;重要：本模板需配合随附 OpenClash 覆写模块使用，模块会把 Provider 健康检查设为 lazy=false，并处理空辅助组。

;审计组：这里应能看到机场实际下发的全部有效节点（不按协议过滤 ANYTLS/VLESS/HY2 等）。
custom_proxy_group=全部节点`select`^(?!.*(邮箱|郵箱|订阅|訂閱|剩余|剩餘|流量|到期|过期|過期|官网|官網|套餐|重置|公告|通知|Traffic|traffic|TRAFFIC|Expire|expire|EXPIRE|USED|TOTAL|EMAIL)).*

;全局自动：优质节点优先，普通节点只在优质节点不可用时接管。
custom_proxy_group=全部优质`fallback`^(?=.*(家宽|家寬|住宅|原生|原生IP|原生 IP|ISP|isp|Residential|residential|RESIDENTIAL|Native|native|NATIVE))(?!.*(邮箱|郵箱|订阅|訂閱|剩余|剩餘|流量|到期|过期|過期|官网|官網|套餐|重置|公告|通知|Traffic|traffic|TRAFFIC|Expire|expire|EXPIRE|USED|TOTAL|EMAIL)).*`https://www.gstatic.com/generate_204`300,5
custom_proxy_group=全部普通`fallback`^(?!.*(家宽|家寬|住宅|原生|原生IP|原生 IP|ISP|isp|Residential|residential|RESIDENTIAL|Native|native|NATIVE|邮箱|郵箱|订阅|訂閱|剩余|剩餘|流量|到期|过期|過期|官网|官網|套餐|重置|公告|通知|Traffic|traffic|TRAFFIC|Expire|expire|EXPIRE|USED|TOTAL|EMAIL)).*`https://www.gstatic.com/generate_204`300,5
custom_proxy_group=全部自动`fallback`[]全部优质`[]全部普通`https://www.gstatic.com/generate_204`300,5

;香港：优质（家宽/住宅/原生/ISP）→ 普通；仅在真实不可用时切换。
